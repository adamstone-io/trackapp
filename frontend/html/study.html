<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="../dist/js/study-main.bundle.js"></script>
    <link rel="stylesheet" href="../dist/css/main.bundle.css" />
    <title>TempoTrack - Study</title>
  </head>
  <body style="visibility: hidden">
    <!-- Header stays full-width -->
    <header>
      <nav class="nav">
        <div class="nav__content">
          <h1 class="nav__title">TEMPO TRACK</h1>
        </div>

        <ul class="nav__links">
          <li class="nav__item">
            <a class="nav__link" href="habits.html">Habits</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="timer.html">Time</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="workspace.html">Workspace</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="stats.html">Stats</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="priming.html">Priming</a>
          </li>
          <li class="nav__item">
            <a class="nav__link nav__link--active" href="study.html">Study</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="reviews.html">Reviews</a>
          </li>
          <li class="nav__item nav__user-menu" id="nav-user-menu">
            <button
              class="nav__link nav__user-btn"
              id="nav-user-btn"
              type="button"
            >
              <span id="nav-user-name">&nbsp;</span>
              <svg
                class="nav__user-arrow"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </li>
        </ul>
      </nav>
      <script>
        (function () {
          var u = localStorage.getItem("authUsername");
          if (u) {
            var nameEl = document.getElementById("nav-user-name");
            if (nameEl) nameEl.textContent = u;
          }
        })();
      </script>
    </header>

    <!-- Container centers main content -->
    <div class="container">
      <main>
        <div class="study-header">
          <div class="study-header__top">
            <h1 class="study-header__title">Study</h1>
            <button
              id="header-menu-btn"
              class="icon-btn"
              aria-label="More options"
              type="button"
            >
              <svg
                class="icon"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <circle cx="8" cy="2" r="1.5" />
                <circle cx="8" cy="8" r="1.5" />
                <circle cx="8" cy="14" r="1.5" />
              </svg>
            </button>
          </div>
          <div class="study-header__quick-add">
            <textarea
              id="quick-add-study-input"
              placeholder="What are you studying?"
              maxlength="2000"
              rows="1"
            ></textarea>

            <div
              id="quick-add-image-preview"
              class="quick-add-image-preview hidden"
            >
              <img id="quick-add-image-preview-img" alt="" />
            </div>

            <div id="quick-add-notes-wrap" class="quick-add-notes">
              <textarea
                id="quick-add-notes-input"
                placeholder="Notes (optional)"
                maxlength="500"
                rows="2"
              ></textarea>
            </div>

            <div
              id="quick-add-note-image-preview"
              class="quick-add-image-preview hidden"
            >
              <img id="quick-add-note-image-preview-img" alt="" />
            </div>

            <div class="study-header__bottom-row">
              <div class="quick-add-row">
                <div class="category-input-wrapper">
                  <div class="category-input-group">
                    <input
                      id="quick-add-category-input"
                      type="text"
                      placeholder="Category (optional)"
                      maxlength="50"
                      autocomplete="off"
                    />
                    <button
                      id="quick-add-category-pin-btn"
                      class="category-pin-btn"
                      type="button"
                      aria-label="Pin category"
                      aria-pressed="false"
                      title="Pin category"
                    >
                      📌
                    </button>
                  </div>
                  <div
                    id="category-dropdown"
                    class="category-dropdown hidden"
                  ></div>
                </div>

                <button
                  id="quick-add-notes-toggle-btn"
                  class="btn btn--outline quick-add-action-btn"
                  type="button"
                >
                  Hide Notes
                </button>
                <button
                  id="quick-add-image-btn"
                  class="btn btn--outline quick-add-action-btn"
                  type="button"
                >
                  Prompt Image
                </button>
                <input
                  type="file"
                  id="quick-add-image-input"
                  accept="image/*"
                  hidden
                />
                <button
                  id="quick-add-note-image-btn"
                  class="btn btn--outline quick-add-action-btn"
                  type="button"
                >
                  Note Image
                </button>
                <input
                  type="file"
                  id="quick-add-note-image-input"
                  accept="image/*"
                  hidden
                />
              </div>

              <button id="add-study-btn" class="btn btn--primary" type="button">
                Add
              </button>
            </div>
          </div>
        </div>

        <section>
          <div id="study-list" class="study-list">
            <!-- Study items populated by JS -->
          </div>
          <div
            id="study-list-empty"
            class="study-list-empty"
            style="display: none"
          >
            No study items yet. Convert prime items or create one from the menu.
          </div>
        </section>
      </main>
    </div>

    <!-- Modal for adding/editing study items -->
    <div id="study-modal" class="modal hidden">
      <div class="modal__content">
        <h2 id="study-modal-title">Add Study Item</h2>

        <form id="study-form" class="study-form">
          <div class="form-group">
            <label for="study-title">Prompt *</label>
            <input
              id="study-title"
              type="text"
              placeholder="What topic are you studying?"
              maxlength="100"
              required
            />
          </div>

          <div class="form-group">
            <label for="study-category">Category</label>
            <div class="category-input-wrapper">
              <input
                id="study-category"
                type="text"
                placeholder="Optional: Categorize this study item..."
                maxlength="50"
                autocomplete="off"
              />
              <div
                id="modal-category-dropdown"
                class="category-dropdown hidden"
              ></div>
            </div>
          </div>

          <div class="form-group">
            <label for="study-notes">Notes</label>
            <textarea
              id="study-notes"
              placeholder="Optional: Add study notes..."
              maxlength="5000"
              rows="4"
            ></textarea>
          </div>

          <div class="form-group">
            <label>Prompt Image</label>
            <div class="modal-image-section">
              <div id="modal-prompt-image-preview" class="modal-image-preview hidden">
                <img id="modal-prompt-image-preview-img" src="" alt="Prompt image" class="modal-image-preview__img" />
                <button type="button" id="modal-prompt-image-remove-btn" class="btn btn--outline btn--sm">Remove</button>
              </div>
              <label class="btn btn--outline btn--sm modal-image-upload-label">
                Upload Image
                <input type="file" id="modal-prompt-image-input" accept="image/*" class="hidden" />
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Note Image</label>
            <div class="modal-image-section">
              <div id="modal-note-image-preview" class="modal-image-preview hidden">
                <img id="modal-note-image-preview-img" src="" alt="Note image" class="modal-image-preview__img" />
                <button type="button" id="modal-note-image-remove-btn" class="btn btn--outline btn--sm">Remove</button>
              </div>
              <label class="btn btn--outline btn--sm modal-image-upload-label">
                Upload Image
                <input type="file" id="modal-note-image-input" accept="image/*" class="hidden" />
              </label>
            </div>
          </div>

          <div class="modal__actions">
            <button type="submit" id="study-save-btn" class="btn btn--primary">
              Save
            </button>
            <button
              type="button"
              id="study-cancel-btn"
              class="btn btn--outline"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TempoTrack - Priming</title>
    <link rel="stylesheet" href="../css/main.css" />
    <script src="../js/utils/config-bootstrap.js"></script>
    <script type="module" src="../js/priming-main.js"></script>
  </head>
  <body style="visibility: hidden">
    <!-- Header stays full-width -->
    <header>
      <nav class="nav">
        <div class="nav__content">
          <h1 class="nav__title">TEMPO TRACK</h1>
        </div>

        <ul class="nav__links">
          <li class="nav__item">
            <a class="nav__link" href="habits.html">Habits</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="timer.html">Time</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="workspace.html">Workspace</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="stats.html">Stats</a>
          </li>
          <li class="nav__item">
            <a class="nav__link nav__link--active" href="priming.html"
              >Priming</a
            >
          </li>
          <li class="nav__item">
            <a class="nav__link" href="study.html">Study</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="reviews.html">Reviews</a>
          </li>
          <li class="nav__item nav__user-menu" id="nav-user-menu">
            <button
              class="nav__link nav__user-btn"
              id="nav-user-btn"
              type="button"
            >
              <span id="nav-user-name">&nbsp;</span>
              <svg
                class="nav__user-arrow"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </li>
        </ul>
      </nav>
      <script>
        (function () {
          var u = localStorage.getItem("authUsername");
          if (u) {
            var nameEl = document.getElementById("nav-user-name");
            if (nameEl) nameEl.textContent = u;
          }
        })();
      </script>
    </header>

    <!-- Container centers main content -->
    <div class="container">
      <main>
        <div class="priming-header">
          <div class="priming-header__top">
            <h1 class="priming-header__title">Study Priming</h1>
            <button
              id="header-menu-btn"
              class="icon-btn"
              aria-label="More options"
              type="button"
            >
              <svg
                class="icon"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <circle cx="8" cy="2" r="1.5" />
                <circle cx="8" cy="8" r="1.5" />
                <circle cx="8" cy="14" r="1.5" />
              </svg>
            </button>
          </div>
          <div class="priming-header__quick-add">
            <textarea
              id="quick-add-prime-input"
              placeholder="What do you want to prime?"
              maxlength="2000"
              rows="1"
            ></textarea>
            <div
              id="quick-add-image-preview"
              class="quick-add-image-preview hidden"
            >
              <img id="quick-add-image-preview-img" alt="" />
            </div>
            <div id="quick-add-notes-wrap" class="quick-add-notes hidden">
              <textarea
                id="quick-add-notes-input"
                placeholder="Notes (optional)"
                maxlength="500"
                rows="2"
              ></textarea>
            </div>
            <div
              id="quick-add-note-image-preview"
              class="quick-add-image-preview hidden"
            >
              <img id="quick-add-note-image-preview-img" alt="" />
            </div>
            <div class="priming-header__bottom-row">
              <div class="quick-add-row">
                <div class="category-input-wrapper">
                  <input
                    id="quick-add-category-input"
                    type="text"
                    placeholder="Category (optional)"
                    maxlength="50"
                    autocomplete="off"
                  />
                  <div
                    id="category-dropdown"
                    class="category-dropdown hidden"
                  ></div>
                </div>
                <button
                  id="quick-add-notes-toggle-btn"
                  class="btn btn--outline"
                  type="button"
                >
                  Add Notes
                </button>
                <button
                  id="quick-add-image-btn"
                  class="btn btn--outline"
                  type="button"
                >
                  Prompt Image
                </button>
                <input
                  type="file"
                  id="quick-add-image-input"
                  accept="image/*"
                  hidden
                />
                <button
                  id="quick-add-note-image-btn"
                  class="btn btn--outline"
                  type="button"
                >
                  Note Image
                </button>
                <input
                  type="file"
                  id="quick-add-note-image-input"
                  accept="image/*"
                  hidden
                />
              </div>

              <button id="add-prime-btn" class="btn btn--primary" type="button">
                Add
              </button>
            </div>
          </div>
          <input
            type="file"
            id="import-prime-file"
            accept=".txt,.md"
            style="display: none"
          />
        </div>

        <div class="search-bar hidden" id="search-bar">
          <input
            type="text"
            id="search-input"
            placeholder="Search primes..."
            autocomplete="off"
          />
          <button id="clear-search" class="btn-icon" type="button">✕</button>
        </div>

        <div class="active-filter" id="active-filter" style="display: none">
          Filtered by: <strong id="filter-name"></strong>
          <button id="clear-filter" class="btn-icon" type="button">✕</button>
        </div>

        <section>
          <div id="prime-list-loading" class="prime-list-loading hidden">
            <div class="loading-spinner">
              <span class="loading-spinner__icon" aria-hidden="true"></span>
              <span>Loading primes...</span>
            </div>
          </div>
          <div id="prime-list" class="prime-list">
            <!-- Prime items populated by JS -->
          </div>
          <div
            id="prime-list-empty"
            class="prime-list-empty"
            style="display: none"
          >
            No prime items yet. Click "Add Prime Item" to get started.
          </div>
        </section>
      </main>
    </div>

    <!-- Modal for adding/editing prime items -->
    <div id="prime-modal" class="modal hidden">
      <div class="modal__content">
        <h2 id="prime-modal-title">Add Prime Item</h2>

        <form id="prime-form" class="prime-form">
          <div class="form-group">
            <label for="prime-title">Prompt *</label>
            <input
              id="prime-title"
              type="text"
              placeholder="What topic are you priming?"
              maxlength="100"
              required
            />
          </div>

          <div class="form-group">
            <label for="prime-category">Category</label>
            <div class="category-input-wrapper">
              <input
                id="prime-category"
                type="text"
                placeholder="Optional: Categorize this prime item..."
                maxlength="50"
                autocomplete="off"
              />
              <div
                id="modal-category-dropdown"
                class="category-dropdown hidden"
              ></div>
            </div>
          </div>

          <div class="form-group">
            <label for="prime-notes">Notes</label>
            <textarea
              id="prime-notes"
              placeholder="Optional: Add notes..."
              maxlength="5000"
              rows="4"
            ></textarea>
          </div>

          <div class="form-group">
            <label>Prompt Image</label>
            <div class="modal-image-section">
              <div id="modal-prompt-image-preview" class="modal-image-preview hidden">
                <img id="modal-prompt-image-preview-img" src="" alt="Prompt image" class="modal-image-preview__img" />
                <button type="button" id="modal-prompt-image-remove-btn" class="btn btn--outline btn--sm">Remove</button>
              </div>
              <label class="btn btn--outline btn--sm modal-image-upload-label">
                Upload Image
                <input type="file" id="modal-prompt-image-input" accept="image/*" class="hidden" />
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Note Image</label>
            <div class="modal-image-section">
              <div id="modal-note-image-preview" class="modal-image-preview hidden">
                <img id="modal-note-image-preview-img" src="" alt="Note image" class="modal-image-preview__img" />
                <button type="button" id="modal-note-image-remove-btn" class="btn btn--outline btn--sm">Remove</button>
              </div>
              <label class="btn btn--outline btn--sm modal-image-upload-label">
                Upload Image
                <input type="file" id="modal-note-image-input" accept="image/*" class="hidden" />
              </label>
            </div>
          </div>

          <div class="modal__actions">
            <button type="submit" id="prime-save-btn" class="btn btn--primary">
              Save
            </button>
            <button
              type="button"
              id="prime-cancel-btn"
              class="btn btn--outline"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>

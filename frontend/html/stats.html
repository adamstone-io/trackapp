<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="../dist/js/stats-main.bundle.js"></script>
    <link rel="stylesheet" href="../dist/css/main.bundle.css" />
    <title>TempoTrack - Stats</title>
  </head>
  <body style="visibility: hidden">
    <header>
      <nav class="nav">
        <div class="nav__content">
          <h1 class="nav__title">TEMPO TRACK</h1>
        </div>

        <ul class="nav__links">
          <li class="nav__item">
            <a class="nav__link" href="habits.html">Habits</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="timer.html">Time</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="workspace.html">Workspace</a>
          </li>
          <li class="nav__item">
            <a class="nav__link nav__link--active" href="stats.html">Stats</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="priming.html">Priming</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="study.html">Study</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="reviews.html">Reviews</a>
          </li>
          <li class="nav__item nav__user-menu" id="nav-user-menu">
            <button class="nav__link nav__user-btn" id="nav-user-btn" type="button">
              <span id="nav-user-name">&nbsp;</span>
              <svg class="nav__user-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </li>
        </ul>
      </nav>
      <script>
        (function() {
          var u = localStorage.getItem("authUsername");
          if (u) {
            var nameEl = document.getElementById("nav-user-name");
            if (nameEl) nameEl.textContent = u;
          }
        })();
      </script>
    </header>

    <div class="container">
      <main class="timer-main">
        <section class="today-entries">
          <!-- Period Filter -->
          <div id="stats-period-filter" class="stats-period-filter">
            <button data-period="today" class="btn btn--primary" type="button">
              Today
            </button>
            <button data-period="yesterday" class="btn btn--outline" type="button">
              Yesterday
            </button>
            <button data-period="this_week" class="btn btn--outline" type="button">
              This Week
            </button>
            <button data-period="this_month" class="btn btn--outline" type="button">
              This Month
            </button>
          </div>

          <!-- Summary Card -->
          <div class="stats-summary-cards">
            <div class="entry-card">
              <div class="entry-card__header">
                <span class="entry-card__title">Time Logged</span>
                <span id="stats-total-time" class="entry-card__duration"
                  >0m</span
                >
              </div>
              <div class="entry-card__meta">
                <span id="stats-summary" class="entry-card__time"></span>
              </div>
            </div>

            <div class="entry-card">
              <div class="entry-card__header">
                <span class="entry-card__title">Primes Logged</span>
                <span id="stats-prime-count" class="entry-card__duration"
                  >0</span
                >
              </div>
              <div class="entry-card__meta">
                <span class="entry-card__time">Prime interactions</span>
              </div>
            </div>

            <div class="entry-card">
              <div class="entry-card__header">
                <span class="entry-card__title">Studies Logged</span>
                <span id="stats-study-count" class="entry-card__duration"
                  >0</span
                >
              </div>
              <div class="entry-card__meta">
                <span class="entry-card__time">Study interactions</span>
              </div>
            </div>

            <div class="entry-card">
              <div class="entry-card__header">
                <span class="entry-card__title">Reviews Logged</span>
                <span id="stats-review-count" class="entry-card__duration"
                  >0</span
                >
              </div>
              <div class="entry-card__meta">
                <span class="entry-card__time">Review interactions</span>
              </div>
            </div>
          </div>

          <div class="stats-actions">
            <button
              id="stats-refresh-btn"
              class="btn btn--outline"
              type="button"
            >
              Refresh
            </button>
          </div>

          <h2 class="today-entries__title">Time by Task</h2>

          <div id="stats-by-task-list" class="today-entries__list"></div>

          <div
            id="stats-empty"
            class="today-entries__empty"
            style="display: none"
          >
            No time entries logged for this period
          </div>
        </section>
      </main>
    </div>

  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="../dist/js/login-main.bundle.js"></script>
    <link rel="stylesheet" href="../dist/css/main.bundle.css" />
    <title>Login | TempoTrack</title>
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-page__card">
        <h1 id="auth-title" class="auth-page__title">Sign in</h1>
        <p id="auth-message" class="auth-page__message"></p>

        <form id="auth-form" class="form-stack" method="post">
          <div class="form-group">
            <label for="auth-username">Username</label>
            <input
              id="auth-username"
              name="username"
              type="text"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="auth-password">Password</label>
            <input
              id="auth-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <div id="auth-email-group" class="form-group hidden">
            <label for="auth-email">Email</label>
            <input
              id="auth-email"
              name="email"
              type="email"
              autocomplete="email"
            />
          </div>

          <div id="auth-registration-code-group" class="form-group hidden">
            <label for="auth-registration-code">Registration code</label>
            <input
              id="auth-registration-code"
              name="registration-code"
              type="text"
              autocomplete="one-time-code"
            />
          </div>

          <button
            id="auth-submit"
            type="submit"
            class="btn btn--primary btn--block"
          >
            Log In
          </button>

          <button
            id="auth-toggle"
            type="button"
            class="btn btn--ghost btn--block"
          >
            Need an account? Register
          </button>
        </form>
      </div>
    </main>

  </body>
</html>
